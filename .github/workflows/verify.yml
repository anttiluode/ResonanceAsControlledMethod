name: Verify cavity and interrogation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and no-dependency regressions
        run: |
          node --check core.js
          node --check worker.js
          node --check app.js
          node tests.cjs
          node --check geometry-core.js
          node geometry-tests.cjs
          node --check geometry-worker.js
          node --check geometry-ui.js
          node --check directional-core.js
          node directional-tests.cjs
